[project]
name = "phd_parser"
version = "0.2.0"
description = "Read and process the raw data of catalysis lab instruments (IR, Raman, MS, GC, LabView, XRD, TGA, physisorption) into one consistent xarray form, with provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julius Sommer", email = "julius_sommer@mailbox.org" }]
requires-python = ">=3.13"
keywords = ["catalysis", "spectroscopy", "chromatography", "mass-spectrometry", "xarray", "data-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "scipy>=1.17.1",
    "xarray>=2026.4.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
# SpectroChemPy backend for OMNIC .spa files and the NDDataset bridge
spectrochempy = ["spectrochempy>=0.8.1"]
# RamanSPy bridge
ramanspy = ["ramanspy>=0.2.10"]
# reading .spa files from http(s) URLs
url = ["requests>=2.32"]
all = ["phd_parser[spectrochempy,ramanspy,url]"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "spectrochempy>=0.8.1",
    "ramanspy>=0.2.10",
    "requests>=2.32",
]

[project.urls]
Repository = "https://github.com/js-chemE/PhD_parser"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phd_parser.naming.species" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:phd_parser",
]
